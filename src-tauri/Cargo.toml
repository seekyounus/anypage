[package]
name = "anypage"
version = "0.1.0"
description = "Free, ad-free document reader for Windows and Android"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/seekyounus/anypage"

[lib]
# the _lib suffix avoids a name clash with the binary on Windows
name = "anypage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Smaller test builds for phones (no debug symbols).
[profile.dev]
debug = false
