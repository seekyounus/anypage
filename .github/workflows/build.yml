name: Build apps

# Builds the Windows installer and the Android app on every push to main,
# and when started by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm install

      - name: Make app icons
        run: npx tauri icon app-icon.png

      - name: Build
        run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: AnyPage-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner already has the Android SDK and NDK installed.
      - name: Use the runner's Android SDK and NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "SDK: $ANDROID_SDK_ROOT  NDK: $ANDROID_NDK_LATEST_HOME"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm install

      - name: Create the Android project
        run: npx tauri android init --ci

      - name: Add AnyPage's Android code
        run: python3 tools/android_setup.py

      - name: Make app icons
        run: npx tauri icon app-icon.png

      # Debug build: signed automatically, so it installs straight onto a phone.
      # Each build gets a new signing key, so uninstall the old version before installing a new one.
      - name: Build
        run: npx tauri android build --apk --debug --target aarch64

      - name: Show the file associations Android will see
        run: grep -n "intent-filter" -A6 src-tauri/gen/android/app/src/main/AndroidManifest.xml | head -80

      - name: Rename the app file
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Built $apk"
          cp "$apk" AnyPage-android-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AnyPage-Android
          path: AnyPage-android-arm64.apk
          if-no-files-found: error
